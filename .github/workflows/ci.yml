name: CI

# Required from the first push (ARCHITECTURE.md A9). Every job calls scripts/gate.sh, so a
# local run and a CI run cannot disagree. No job needs a secret, and no job may be disabled,
# skipped or marked allowed-to-fail to get a green run: the jobs below that are conditional
# are conditional only on whether the thing they check exists yet.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Read-only by default; no job widens this.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_VERSION: '10.0.x'
  GITLEAKS_VERSION: '8.30.1'
  ACTIONLINT_VERSION: '1.7.12'

jobs:
  # What exists in the tree decides which later jobs have anything to do.
  discover:
    name: discover
    runs-on: ubuntu-latest
    outputs:
      has_solution: ${{ steps.look.outputs.has_solution }}
      has_integration: ${{ steps.look.outputs.has_integration }}
      has_e2e: ${{ steps.look.outputs.has_e2e }}
      has_compose: ${{ steps.look.outputs.has_compose }}
      touches_infra: ${{ steps.look.outputs.touches_infra }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: look
        name: Look for solution, test projects and infrastructure changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          emit() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }

          yesno() { if eval "$1"; then emit "$2" true; else emit "$2" false; fi; }
          yesno 'ls -1 ./*.sln ./*.slnx >/dev/null 2>&1' has_solution
          yesno '[ -d tests/Integration ]'                has_integration
          yesno '[ -d tests/E2E ]'                        has_e2e
          yesno '[ -f docker-compose.yml ]'               has_compose

          base=""
          if [ -n "${BASE_SHA:-}" ]; then
            base="$BASE_SHA"
          elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            base="$BEFORE_SHA"
          fi

          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "$base" "$GITHUB_SHA")"
          else
            changed="$(git ls-files)"   # first push on a branch: treat everything as changed
          fi

          if printf '%s\n' "$changed" | grep -qE '^(infra/|\.github/)'; then
            emit touches_infra true
          else
            emit touches_infra false
          fi

  unit:
    name: unit
    runs-on: ubuntu-latest
    needs: discover
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: needs.discover.outputs.has_solution == 'true'
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        if: needs.discover.outputs.has_solution == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build with warnings as errors, format check, unit and architecture tests
        run: scripts/gate.sh unit

  integration:
    name: integration
    runs-on: ubuntu-latest
    needs: discover
    if: needs.discover.outputs.has_integration == 'true'
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'Local_Dev_Not_A_Secret_1'
          MSSQL_PID: Developer
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Wait for SQL Server
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/1433) >/dev/null 2>&1; then
              echo "SQL Server is accepting connections after ${i}s."
              exit 0
            fi
            sleep 1
          done
          echo "SQL Server did not become reachable within 60s." >&2
          exit 1

      - name: Integration, concurrency, authorization-matrix, lockout and start-up tests
        env:
          # A local container with an obviously fake password; not a secret.
          GATE_SQL_CONNECTION: >-
            Server=127.0.0.1,1433;User Id=sa;Password=Local_Dev_Not_A_Secret_1;
            Encrypt=True;TrustServerCertificate=True
        run: scripts/gate.sh integration

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: discover
    if: >-
      github.event_name == 'pull_request' &&
      needs.discover.outputs.has_e2e == 'true' &&
      needs.discover.outputs.has_compose == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Start the compose stack
        run: docker compose up --detach --wait

      - name: Playwright journeys
        run: scripts/gate.sh all

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop the compose stack
        if: always()
        run: docker compose down --volumes

  scan:
    name: scan
    runs-on: ubuntu-latest
    needs: discover
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: needs.discover.outputs.has_solution == 'true'
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location "$url" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Secret scan and dependency audit
        run: scripts/gate.sh scan

  infra:
    name: infra
    runs-on: ubuntu-latest
    needs: discover
    if: needs.discover.outputs.touches_infra == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location "$url" -o /tmp/actionlint.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
          actionlint --version

      - name: Bicep build and lint, workflow lint
        run: scripts/gate.sh infra
