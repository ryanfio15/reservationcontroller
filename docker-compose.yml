# The local stack: the app and a SQL Server container. `docker compose up` is all a person needs
# to run both journeys by hand (A1 item 1) and is what the Playwright tests run against.
#
# Every credential here is deliberately fake and local-only. Nothing in this file is a secret,
# and nothing in it is used by a deployed environment — Azure reads its connection details from
# managed identity and Key Vault.

name: reservationcontroller

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: reservations-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Local_Dev_Not_A_Secret_1"
      MSSQL_PID: Developer
    ports:
      - "11433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      # The 2022 image ships sqlcmd under mssql-tools18, which needs -C for its self-signed cert.
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
          -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: src/Web/Dockerfile
    container_name: reservations-web
    depends_on:
      sql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      # Reached by service name on the compose network, not through the published port.
      ConnectionStrings__Reservations: >-
        Server=sql,1433;Database=Reservations;User Id=sa;Password=Local_Dev_Not_A_Secret_1;
        Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=False
    ports:
      - "8080:8080"
    healthcheck:
      # /healthz checks the process only and never the database, so this probe cannot hold a
      # paused database awake (B: Cross-cutting concerns).
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

volumes:
  sql-data:
