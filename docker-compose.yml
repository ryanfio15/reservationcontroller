# The local stack: the app and a SQL Server container. `docker compose up` is all a person needs
# to run both journeys by hand (A1 item 1) and is what the Playwright tests run against.
#
# Every credential here is deliberately fake and local-only. Nothing in this file is a secret,
# and nothing in it is used by a deployed environment — Azure reads its connection details from
# managed identity and Key Vault.

name: reservationcontroller

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: reservations-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Local_Dev_Not_A_Secret_1"
      MSSQL_PID: Developer
    ports:
      - "11433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      # The 2022 image ships sqlcmd under mssql-tools18, which needs -C for its self-signed cert.
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
          -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: src/Web/Dockerfile
    container_name: reservations-web
    depends_on:
      sql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      # Reached by service name on the compose network, not through the published port.
      ConnectionStrings__Reservations: >-
        Server=sql,1433;Database=Reservations;User Id=sa;Password=Local_Dev_Not_A_Secret_1;
        Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=False
    ports:
      - "8080:8080"
    healthcheck:
      # /healthz checks the process only and never the database, so this probe cannot hold a
      # paused database awake (B: Cross-cutting concerns).
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  # Runs the gate inside a container, so "build and tests pass in the container" is a command
  # anyone can repeat rather than something that was done once by hand. Not started by
  # `docker compose up`: it belongs to the `gate` profile.
  #
  #   docker compose run --rm gate unit
  #   docker compose run --rm gate integration
  #
  # It bind-mounts the working tree rather than copying it, so it tests exactly what is checked
  # out. `clean-clone` below is the one that proves a fresh clone works.
  gate:
    image: mcr.microsoft.com/dotnet/sdk:10.0-noble
    profiles: ["gate"]
    working_dir: /repo
    volumes:
      - .:/repo
      - nuget-cache:/root/.nuget/packages
    environment:
      HOME: /root
      GATE_SQL_CONNECTION: >-
        Server=sql,1433;Database=Reservations;User Id=sa;Password=Local_Dev_Not_A_Secret_1;
        Encrypt=True;TrustServerCertificate=True
    entrypoint: ["bash", "scripts/gate.sh"]
    command: ["unit"]

  # A5 phase 0 and A8 ask for the gate to pass "from a clean clone, in a container". This clones
  # the repository's committed state into the container and runs the gate against that, so a file
  # that exists only in the working tree — an ignored vendored asset, say — fails here.
  #
  #   docker compose run --rm clean-clone unit
  clean-clone:
    image: mcr.microsoft.com/dotnet/sdk:10.0-noble
    profiles: ["gate"]
    working_dir: /src
    volumes:
      - .:/src:ro
      - nuget-cache:/root/.nuget/packages
    environment:
      HOME: /root
    entrypoint:
      - bash
      - -c
      - 'git clone --quiet /src /clone && cd /clone && exec bash scripts/gate.sh "$@"'
      - --
    command: ["unit"]

volumes:
  sql-data:
  nuget-cache:
